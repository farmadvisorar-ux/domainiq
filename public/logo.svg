<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#16133a"/>
    </linearGradient>

    <!-- Outer Rim Glow Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Neon Purple Core Gradient -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Cyber Cyan / Emerald Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Crystal Facet Highlight -->
    <linearGradient id="facetHighlight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#e0e7ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters for Intense Cyber Glow -->
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="18" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Obsidian Rounded Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- High-Precision Cyber Perimeter Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#rimGrad)" stroke-width="3" stroke-opacity="0.4"/>

  <!-- Inner Ambient Aura -->
  <circle cx="256" cy="256" r="150" fill="#7c3aed" opacity="0.12" filter="url(#coreGlow)"/>
  <circle cx="256" cy="270" r="110" fill="#06b6d4" opacity="0.08" filter="url(#coreGlow)"/>

  <!-- Orbital Valuation Rings (Geometric Precision) -->
  <ellipse cx="256" cy="256" rx="170" ry="85" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.35" transform="rotate(-25 256 256)"/>
  <ellipse cx="256" cy="256" rx="150" ry="75" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="2 6" opacity="0.4" transform="rotate(25 256 256)"/>

  <!-- ======================================================== -->
  <!-- CENTRAL TALISMAN / DV PRISM EMBLEM                      -->
  <!-- ======================================================== -->

  <!-- Left 'D' Arch (Institutional Vault Casing) -->
  <path d="M 148 152 
           C 148 152, 230 152, 270 180 
           C 310 208, 310 270, 275 310 
           C 240 350, 165 360, 148 360" 
        fill="none" 
        stroke="url(#cyanGrad)" 
        stroke-width="26" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#coreGlow)"/>

  <!-- Back Shadow for Depth -->
  <polygon points="256,120 368,290 256,410 144,290" fill="#0b0f24" opacity="0.85"/>

  <!-- The Mystic 'V' Nexus (Luminous Crystal Falcon) -->
  <path d="M 172 176 L 256 364 L 340 176" 
        fill="none" 
        stroke="url(#purpleGrad)" 
        stroke-width="32" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#coreGlow)"/>

  <!-- Inner Diamond Core (Algorithmic Appraisal Eye) -->
  <polygon points="256,195 298,260 256,325 214,260" fill="url(#purpleGrad)" filter="url(#softGlow)"/>
  <polygon points="256,200 290,260 256,320 256,200" fill="url(#facetHighlight)"/>

  <!-- Center Floating Spark / Valuation Orb -->
  <circle cx="256" cy="260" r="10" fill="#ffffff" filter="url(#coreGlow)"/>
  <circle cx="256" cy="260" r="4" fill="#67e8f9"/>

  <!-- Floating Energy Nodes (Ascending Valuation Points) -->
  <circle cx="172" cy="176" r="8" fill="#38bdf8" filter="url(#coreGlow)"/>
  <circle cx="340" cy="176" r="8" fill="#c084fc" filter="url(#coreGlow)"/>
  <circle cx="256" cy="364" r="10" fill="#34d399" filter="url(#coreGlow)"/>

  <!-- Ascending Cyber Vector Arrow from V Bottom -->
  <path d="M 256 364 L 256 420" stroke="url(#cyanGrad)" stroke-width="6" stroke-linecap="round" opacity="0.8" filter="url(#softGlow)"/>
  <polygon points="256,432 248,416 264,416" fill="#10b981" filter="url(#softGlow)"/>
</svg>
