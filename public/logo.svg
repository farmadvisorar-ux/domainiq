<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="45%" stop-color="#0b1021"/>
      <stop offset="100%" stop-color="#120e29"/>
    </linearGradient>

    <!-- Outer Bevel Perimeter -->
    <linearGradient id="perimeterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#818cf8" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Wing D (Institutional Cyan/Emerald Vault) -->
    <linearGradient id="wingDGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Wing V (Mystic Ultraviolet Prism) -->
    <linearGradient id="wingVGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="45%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Core Facet Gold Radiance -->
    <linearGradient id="goldCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Dynamic Surface Shimmer -->
    <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Intense Holographic Glow Filters -->
    <filter id="intenseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur1"/>
      <feGaussianBlur stdDeviation="28" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="crispGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Obsidian Squircle Foundation -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="url(#perimeterGrad)" stroke-width="2.5" stroke-opacity="0.45"/>

  <!-- Ambient Internal Atmospheric Halo -->
  <circle cx="256" cy="256" r="160" fill="#7c3aed" opacity="0.16" filter="url(#intenseGlow)"/>
  <circle cx="256" cy="256" r="100" fill="#06b6d4" opacity="0.12" filter="url(#intenseGlow)"/>

  <!-- Orbital Valuation Rings (Geometric Precision Grid) -->
  <ellipse cx="256" cy="256" rx="180" ry="90" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="3 9" opacity="0.3" transform="rotate(-30 256 256)"/>
  <ellipse cx="256" cy="256" rx="160" ry="80" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 8" opacity="0.25" transform="rotate(30 256 256)"/>

  <!-- ======================================================== -->
  <!-- THE SACRED DV TALISMAN MONOGRAM                           -->
  <!-- ======================================================== -->

  <!-- Left 'D' Enclosure (Precision Vault Arch) -->
  <path d="M 160 145 
           L 248 145 
           C 318 145, 352 188, 352 256 
           C 352 324, 318 367, 248 367 
           L 160 367" 
        fill="none" 
        stroke="url(#wingDGrad)" 
        stroke-width="28" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        opacity="0.45"
        filter="url(#intenseGlow)"/>

  <path d="M 160 145 
           L 248 145 
           C 318 145, 352 188, 352 256 
           C 352 324, 318 367, 248 367 
           L 160 367" 
        fill="none" 
        stroke="url(#wingDGrad)" 
        stroke-width="28" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- The Mystic 'V' Chevron (Sharp Prismatic Crystal Core) -->
  <path d="M 152 165 
           L 256 385 
           L 360 165" 
        fill="none" 
        stroke="url(#wingVGrad)" 
        stroke-width="34" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#intenseGlow)"/>

  <!-- V Highlight Ridge -->
  <path d="M 162 170 
           L 256 370 
           L 350 170" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="6" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        opacity="0.8"
        filter="url(#crispGlow)"/>

  <!-- Inner Sacred Hex-Diamond (Consensus Valuation Aperture) -->
  <polygon points="256,182 308,256 256,330 204,256" fill="#0d132b" stroke="url(#wingVGrad)" stroke-width="4" opacity="0.95"/>
  <polygon points="256,185 304,256 256,256" fill="url(#shimmerGrad)"/>
  <polygon points="256,256 304,256 256,326" fill="url(#wingDGrad)" opacity="0.3"/>

  <!-- Central Super-Luminous Core Focus Point -->
  <circle cx="256" cy="256" r="14" fill="url(#goldCoreGrad)" filter="url(#intenseGlow)"/>
  <circle cx="256" cy="256" r="6" fill="#ffffff"/>

  <!-- North-South Valuation Ray (Laser Alignment) -->
  <line x1="256" y1="96" x2="256" y2="155" stroke="url(#wingDGrad)" stroke-width="4" stroke-linecap="round" opacity="0.8" filter="url(#crispGlow)"/>
  <circle cx="256" cy="96" r="5" fill="#38bdf8" filter="url(#crispGlow)"/>

  <line x1="256" y1="385" x2="256" y2="435" stroke="url(#wingVGrad)" stroke-width="4" stroke-linecap="round" opacity="0.8" filter="url(#crispGlow)"/>
  <circle cx="256" cy="438" r="6" fill="#10b981" filter="url(#crispGlow)"/>

  <!-- Cardinal Telemetry Diamonds -->
  <polygon points="120,256 126,250 132,256 126,262" fill="#38bdf8" filter="url(#crispGlow)"/>
  <polygon points="392,256 386,250 380,256 386,262" fill="#c084fc" filter="url(#crispGlow)"/>
</svg>
