<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="100%" stop-color="#120e29"/>
    </linearGradient>
    <linearGradient id="favPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="favCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="favGlow">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#favBg)"/>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="none" stroke="url(#favPurple)" stroke-width="1.2" stroke-opacity="0.6"/>

  <!-- Left 'D' Arch -->
  <path d="M 18 18 L 30 18 C 39 18, 44 24, 44 32 C 44 40, 39 46, 30 46 L 18 46" fill="none" stroke="url(#favCyan)" stroke-width="4.5" stroke-linecap="round" filter="url(#favGlow)"/>

  <!-- Center Sharp 'V' Chevron -->
  <path d="M 18 20 L 32 49 L 46 20" fill="none" stroke="url(#favPurple)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#favGlow)"/>

  <!-- White V Highlight -->
  <path d="M 21 21 L 32 46 L 43 21" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Central valuation core spark -->
  <circle cx="32" cy="32" r="3.5" fill="#fef08a" filter="url(#favGlow)"/>
  <circle cx="32" cy="32" r="1.5" fill="#ffffff"/>
  <circle cx="32" cy="49" r="2" fill="#10b981"/>
</svg>
