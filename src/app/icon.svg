<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14"/>
      <stop offset="100%" stop-color="#16133a"/>
    </linearGradient>
    <linearGradient id="favPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="favCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="favGlow">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#favBg)"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="url(#favPurple)" stroke-width="1.2" stroke-opacity="0.5"/>

  <!-- Left 'D' Arch -->
  <path d="M 18 19 C 18 19, 30 19, 36 24 C 42 29, 42 36, 36 41 C 30 46, 18 46, 18 46" fill="none" stroke="url(#favCyan)" stroke-width="4.5" stroke-linecap="round" filter="url(#favGlow)"/>

  <!-- Center Sharp 'V' -->
  <path d="M 22 23 L 34 47 L 46 23" fill="none" stroke="url(#favPurple)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#favGlow)"/>

  <!-- Central valuation core spark -->
  <circle cx="34" cy="33" r="3" fill="#ffffff" filter="url(#favGlow)"/>
  <circle cx="34" cy="47" r="2" fill="#10b981"/>
</svg>
